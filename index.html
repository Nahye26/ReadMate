<title>ReadMate 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{
  /* layout: two-pane workbench. Source viewer on the left, mission thread on the right, server event log as a drawer below. */
  --bg:#eef1f5; --surface:#ffffff; --surface2:#f5f7fa; --ink:#18212d; --muted:#586577; --line:#d6dce5;
  --accent:#2b4fd0; --accent-ink:#ffffff; --accent-soft:#e4eafc;
  --hl:#ffe27a; --hl-ink:#3a2f00;
  --ok:#16794f; --warn:#a85d10; --bad:#b3362f;
  --f-serif:"Noto Serif KR",Georgia,"Times New Roman",serif;
  --f-sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#18202a; --surface2:#1e2733; --ink:#e7ecf2; --muted:#9aa8b9; --line:#2c3744;
    --accent:#8ea6ff; --accent-ink:#0e1530; --accent-soft:#222c4d;
    --hl:#6b5a14; --hl-ink:#fff3c4;
    --ok:#4cc38a; --warn:#e0a15a; --bad:#f08a83;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --surface2:#1e2733; --ink:#e7ecf2; --muted:#9aa8b9; --line:#2c3744;
  --accent:#8ea6ff; --accent-ink:#0e1530; --accent-soft:#222c4d;
  --hl:#6b5a14; --hl-ink:#fff3c4;
  --ok:#4cc38a; --warn:#e0a15a; --bad:#f08a83;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.65;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,textarea{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-serif);font-weight:600;font-size:20px;flex:none}
.brand h1{margin:0;font-size:18px;line-height:1.2;font-weight:700}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;flex:1 1 380px}
.steps li{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface);white-space:nowrap}
.steps li b{font-family:var(--f-mono);font-weight:500;margin-right:5px}
.steps li.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.steps li.done{color:var(--ink)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.pane-h h2{margin:0;font-size:14px;font-weight:700}
.note{font-size:12px;color:var(--muted)}
.src{position:sticky;top:8px}
#doc{padding:6px 16px 16px;max-height:calc(100vh - 150px);overflow:auto}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;letter-spacing:.02em}
.chunk{position:relative;padding:8px 10px 8px 12px;border-left:3px solid transparent;border-radius:0 8px 8px 0;font-family:var(--f-serif);font-size:15px;line-height:1.85;transition:opacity .15s}
.chunk .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px;font-family:var(--f-sans)}
.cid{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tag{font-family:var(--f-sans);font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);line-height:18px}
.tag.m{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chunk.skip{opacity:.72}
body.recall #doc,body.recall .msg blockquote.ex{filter:blur(7px);user-select:none;pointer-events:none}
.chunk.pick{cursor:pointer}
.chunk.pick:hover{background:var(--surface2)}
.chunk.sel{border-left-color:var(--accent);background:var(--accent-soft)}
.hl{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:1px 0;box-shadow:0 0 0 2px var(--hl)}
.chat{display:flex;flex-direction:column}
#thread{display:flex;flex-direction:column;gap:12px;padding:14px 16px 6px}
#dock{padding:6px 16px 16px}
.msg{max-width:100%;min-width:0}
.msg.ai{align-self:stretch}
.msg.me{align-self:flex-end;max-width:88%;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px 12px 2px 12px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .body{background:var(--surface2);border:1px solid var(--line);border-radius:2px 12px 12px 12px;padding:12px 14px;overflow-wrap:anywhere}
.msg.ai .body>*:first-child{margin-top:0}
.msg.ai .body>*:last-child{margin-bottom:0}
.msg p{margin:8px 0}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:10px}
h3.k{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px;font-weight:700}
h3.k:first-child{margin-top:0}
ul.req{margin:4px 0;padding-left:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.maptbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.maptbl th,.maptbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.maptbl th{font-size:11px;color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 16px;cursor:pointer;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
blockquote.ex{margin:8px 0;padding:10px 14px;border-left:4px solid var(--hl);background:var(--surface);border-radius:0 8px 8px 0;font-family:var(--f-serif);font-size:15.5px;line-height:1.85}
blockquote.ex p{margin:0 0 6px}
blockquote.ex p:last-child{margin:0}
.src-line{font-size:12px;color:var(--muted);margin:2px 0}
.verify{font-family:var(--f-mono);font-size:11.5px;color:var(--ok)}
.q{font-weight:700;margin:10px 0 0}
textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);line-height:1.6}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hintpill{display:inline-block;font-size:11px;padding:0 8px;border-radius:999px;background:var(--hl);color:var(--hl-ink);margin-right:6px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-family:var(--f-mono);font-size:12px;padding:1px 8px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent)}
.mine{margin:6px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.mine li{border-left:3px solid var(--accent);padding:2px 10px;background:var(--surface);border-radius:0 6px 6px 0;font-size:14px}
.mine small{display:block;color:var(--muted);font-size:11px}
.rate{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rate button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:16px}
.rate button:hover{border-color:var(--accent);color:var(--accent)}
dl.sum{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:6px 12px;margin:6px 0}
dl.sum dt{color:var(--muted);font-size:13px}
dl.sum dd{margin:0;font-weight:500}
pre.json{margin:8px 0 0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre}
.logbox{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.logbox summary{cursor:pointer;padding:10px 16px;font-size:13px;font-weight:700}
.logbox summary span{font-family:var(--f-mono);font-weight:400;color:var(--muted);margin-left:8px}
#log{font-family:var(--f-mono);font-size:12px;line-height:1.6;padding:0 16px 8px;max-height:220px;overflow:auto}
#log div{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px dashed var(--line);padding:2px 0}
#log .t{color:var(--muted)}
#log .e{color:var(--accent);font-weight:500}
#log .bad{color:var(--bad);font-weight:500}
.logtools{padding:6px 16px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#testout{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);margin:0}
.fld{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=file]{width:100%;font-size:13px;color:var(--ink)}
select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
select:focus-visible,input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sepline{border:0;border-top:1px solid var(--line);margin:16px 0 4px}
.warn{color:var(--warn);font-size:13px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);margin:8px 0}
.opt h3.k{margin-top:0}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .src{position:static}
  #doc{max-height:340px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">R</span>
      <div><h1>ReadMate</h1><p>읽기까지 챙기는 과제 파트너 · 웹앱 데모</p></div>
    </div>
    <ol class="steps" id="steps"></ol>
    <button class="ghost" id="reset" type="button">처음부터</button>
  </header>

  <main class="grid">
    <section class="pane src" aria-labelledby="srch">
      <div class="pane-h"><h2 id="srch">원문 뷰어</h2><span class="note" id="docnote">자료 없음</span></div>
      <div id="doc"></div>
    </section>

    <section class="pane chat" aria-labelledby="chath">
      <div class="pane-h"><h2 id="chath">ReadMate</h2><span class="note" id="modeNote">자료 대기</span></div>
      <div id="thread" aria-live="polite"></div>
      <div id="dock"></div>
    </section>
  </main>

  <details class="logbox" id="logbox">
    <summary>서버 이벤트 로그<span id="logn">0건</span></summary>
    <div id="log"></div>
    <div class="logtools">
      <button class="ghost" id="halluc" type="button">발췌 검증 테스트: 모델이 원문에 없는 문장을 인용하면?</button>
      <div id="testout"></div>
    </div>
  </details>

  <details class="logbox" id="hist">
    <summary>내 세션 기록<span>이 브라우저에만 저장</span></summary>
    <div id="histbody" style="padding:0 16px 14px"></div>
  </details>

  <details class="logbox" id="own" hidden>
    <summary>수집된 세션 요약<span>소유자 전용, 동의한 세션만</span></summary>
    <div style="padding:0 16px 14px"><div class="row" style="margin-top:0"><button class="ghost" id="ownload" type="button">불러오기</button></div><div id="ownbody" class="note"></div></div>
  </details>

  <p class="foot">Claude가 분석과 피드백을 맡고, 발췌 인용·힌트 단계·로그 집계는 코드가 맡습니다.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var split=function(t){return t.split(/(?<=[.!?。])\s+/).filter(Boolean)};
var WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var TN={ex:'발췌형',cx:'맥락형'};
var STEPS=['자료','읽기 지도','미션·피드백','과제 지원','마무리'];
var PROMPT_VERSION='v0.4';
var CONFIG={missions:3,maxMissions:4,exSent:3,cxSent:8,cpm:400,answerMin:2,maxHints:3,recall:true,timeoutMs:75000,fade:true,supStart:2,adaptDepth:true,lastMinDepth:1,pdfAll:60,maxPages:40,hardPages:1500,maxPick:3};
var QL={literal:'이해',inferential:'추론',evaluative:'평가'};


/* ---------- 상태 ---------- */
var S;
function mapBy(list){var o={};list.forEach(function(c){o[c.id]=c});return o}
function fresh(){
  return {mode:'live',chunks:[],by:{},plans:{},reqs:[],flowBy:{},reasons:{},
    step:0,type:'ex',m:0,att:0,level:0,viewed:false,failed:false,only:false,pick:false,sel:[],
    answers:[],noHint:0,hint:0,hintGiven:0,selfFix:[],load:null,busy:false,assign:'',consent:false,src:'',
    t0:Date.now(),log:[],dev:null,devOn:false,devRef:null,devQ:Promise.resolve(),researcher:'',paperId:'',pages:0,tiers:{},unresolved:[],recallDone:false,recallSkipped:false,sup:CONFIG.supStart,curSup:CONFIG.supStart,cueAsked:false,supPath:[],depth:0,curDepth:0,jol:null,actual:null,calib:''};
}
function plan(){return S.plans[S.type]||[]}
function N(){return plan().length}
function prog(n){return '['+TN[S.type]+' · 미션 '+n+'/'+N()+']'}

/* ---------- 서버 쪽 로직: 발췌 해석, 검증, 복붙 감지 ---------- */
function resolve(spec){
  var c=S.by[spec[0]];
  if(!c) throw new Error('unknown chunk_id '+spec[0]);
  var a=spec[1],b=spec[2],ss=c.s.slice(a-1,b);
  var ok=ss.length===b-a+1&&ss.every(function(s){return c.t.indexOf(s)>=0});
  return {id:c.id,sec:c.sec,text:ss.join(' '),range:a===b?('문장 '+a):('문장 '+a+'–'+b),ok:ok};
}
function validateQuote(id,quote){
  var c=S.by[id];
  if(!c) return {ok:false,reason:'unknown chunk_id'};
  var n=function(s){return s.replace(/\s+/g,'')};
  return n(c.t).indexOf(n(quote))>=0?{ok:true}:{ok:false,reason:'quote not found in chunk'};
}
function bg(s){s=s.replace(/[\s.,?!'"“”]/g,'');var o=new Set();for(var i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o}
function isCopy(ans,ex){
  if(ans.replace(/\s/g,'').length<12) return false;
  var a=bg(ans),b=bg(ex);if(!a.size) return false;
  var h=0;a.forEach(function(x){if(b.has(x))h++});
  return h/a.size>=0.85;
}
function excerptText(m){return m.pick.map(resolve).map(function(p){return p.text}).join(' ')}

/* ---------- 공통 UI ---------- */
function log(type,data,bad){
  var t=((Date.now()-S.t0)/1000).toFixed(1);
  var rec={t:+t,type:type};
  if(data){for(var k in data)rec[k]=data[k]}
  S.log.push(rec);
  var d=document.createElement('div');
  d.innerHTML='<span class="t">+'+t+'s</span> <span class="'+(bad?'bad':'e')+'">'+esc(type)+'</span> '+(data?esc(JSON.stringify(data)):'');
  $('#log').appendChild(d);
  $('#log').scrollTop=$('#log').scrollHeight;
  $('#logn').textContent=S.log.length+'건';
}
function setStep(n){
  S.step=n;
  $('#steps').innerHTML=STEPS.map(function(s,i){
    var c=i===n?'on':(i<n?'done':'');
    return '<li class="'+c+'"><b>'+(i+1)+'</b>'+s+'</li>';
  }).join('');
}
function note(t){$('#modeNote').textContent=t}
function add(role,html,pg){
  var el=document.createElement('div');
  el.className='msg '+role;
  if(role==='me') el.textContent=html;
  else el.innerHTML='<div class="body">'+html+(pg?'<div class="prog">'+esc(pg)+'</div>':'')+'</div>';
  $('#thread').appendChild(el);
  el.scrollIntoView({block:'nearest'});
  return el;
}
function busy(on){
  S.busy=on;
  document.querySelectorAll('#dock button,#dock textarea,#dock input').forEach(function(e){e.disabled=on});
}

/* ---------- 원문 뷰어 ---------- */
function renderDoc(){
  var last='',h=S.chunks.length?'':'<p class="note" style="padding:14px 0">아직 올라온 자료가 없습니다. 오른쪽에서 PDF를 올리거나 본문을 붙여넣으면 문단별로 나뉘어 여기에 표시됩니다.</p>';
  S.chunks.forEach(function(c){
    if(c.sec!==last){h+='<div class="sec">'+esc(c.sec)+'</div>';last=c.sec}
    h+='<div class="chunk" id="ck-'+c.id+'" data-id="'+c.id+'"><div class="meta"><span class="cid">'+c.id+'</span><span class="tag" hidden></span></div><div class="txt">'+
      c.s.map(function(s,i){return '<span data-s="'+(i+1)+'">'+esc(s)+'</span>'}).join(' ')+'</div></div>';
  });
  $('#doc').innerHTML=h;
}
function usage(){
  var u={};
  (plan()||[]).forEach(function(m,i){m.pick.forEach(function(p){if(!u[p[0]])u[p[0]]=i+1})});
  return u;
}
function badges(on){
  var u=usage();
  S.chunks.forEach(function(c){
    var el=$('#ck-'+c.id),tag=el.querySelector('.tag');
    el.classList.remove('skip');tag.className='tag';
    if(!on){tag.hidden=true;return}
    tag.hidden=false;
    if(u[c.id]){tag.textContent='우선순위 높음 · 미션 '+u[c.id];tag.className='tag m'}
    else if((S.flowBy[S.type]||[]).indexOf(c.id)>=0){tag.textContent='우선순위 보통'}
    else{tag.textContent='우선순위 낮음';el.classList.add('skip')}
  });
}
function clearHl(){document.querySelectorAll('#doc .hl').forEach(function(e){e.classList.remove('hl')})}
function highlight(pick){
  clearHl();var first=null;
  pick.forEach(function(p){
    var ck=$('#ck-'+p[0]);if(!ck)return;if(!first)first=ck;
    for(var s=p[1];s<=p[2];s++){var sp=ck.querySelector('[data-s="'+s+'"]');if(sp)sp.classList.add('hl')}
  });
  if(first)first.scrollIntoView({block:'nearest'});
}

/* ---------- 무료로 쓸 수 있는 기능: Claude(뷰어 본인 계정), DB, 저장 ---------- */
var CAP={sample:null,db:null,dl:null,user:null,gem:null,ready:false};
var GEM_MODEL='gemini-3.8-flash';
function hasLLM(){return !!(CAP.sample||(CAP.gem&&CAP.gem.key))}
function initCaps(){
  var t0=Date.now(),diag={claude:!!(window.claude),use:!!(window.claude&&window.claude.use),framed:(function(){try{return window.top!==window.self}catch(e){return true}})(),host:(function(){try{return location.hostname}catch(e){return '?'}})(),res:{}};
  CAP.diag=diag;
  var use=function(n){
    try{
      if(!(window.claude&&window.claude.use)){diag.res[n]='window.claude 없음';return Promise.resolve(null)}

function parseJson(t){

  var a=t.search(/[\{\[]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a>=0&&b>a)c.push(t.slice(a,b+1));
  for(var i=0;i<c.length;i++){try{return JSON.parse(c[i])}catch(e){}}
  throw {code:'invalid_json',message:'JSON 해석 실패, 응답 앞부분: '+String(t).slice(0,80),text:t};
}

/* ---------- 자료 → 청크 (PDF는 pdf.js, 무료·브라우저 안에서 처리) ---------- */
function buildChunks(text,sec,prefix){
  var ss=split(text.replace(/\s+/g,' ').trim()),out=[],cur=[],len=0;
  function flush(){if(!cur.length)return;var k=out.length+1;out.push({id:prefix+k,sec:sec,s:cur,t:cur.join(' ')});cur=[];len=0}
  ss.forEach(function(s){cur.push(s);len+=s.length;if(cur.length>=3||len>300)flush()});
  flush();
  return out;
}
function textChunks(text){
  var out=[];
  text.split(/\n\s*\n/).forEach(function(p,i){
    if(p.trim().length<2)return;
    buildChunks(p,'본문 '+(i+1)+'문단','t'+(i+1)+'-').forEach(function(c){out.push(c)});
  });
  return out;
}
async function pdfRead(file,st){
  if(!window.pdfjsLib) throw {code:'nopdf'};
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER;
  var pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  S.pages=pdf.numPages;
  if(pdf.numPages>CONFIG.hardPages) throw {code:'toolong'};
  var texts=[];
  for(var p=1;p<=pdf.numPages;p++){
    var pg=await pdf.getPage(p),tc=await pg.getTextContent(),t='';
    tc.items.forEach(function(it){t+=it.str;if(it.hasEOL)t+=' '});
    texts.push(t);
    if(st&&(p%10===0||p===pdf.numPages))st.textContent='자료를 읽는 중… '+p+'/'+pdf.numPages+'쪽';
  }
  var secs=await pdfSections(pdf,texts);
  return {texts:texts,secs:secs};
}
async function outlineSecs(pdf){
  var ol=null;
  try{ol=await pdf.getOutline()}catch(e){}
  if(!ol||!ol.length)return [];
  async function pageOf(it){
    try{
      var d=it.dest;if(typeof d==='string')d=await pdf.getDestination(d);
      if(!d||!d[0])return 0;
      var r=d[0];return typeof r==='object'?(await pdf.getPageIndex(r))+1:(+r||0)+1;
    }catch(e){return 0}
  }
  var lvl=ol;
  if(lvl.length<3){
    var flat=[];lvl.forEach(function(x){flat.push(x);(x.items||[]).forEach(function(y){flat.push(y)})});
    lvl=flat;
  }
  var out=[];
  for(var i=0;i<lvl.length&&out.length<150;i++){
    var pg=await pageOf(lvl[i]);
    if(pg>0)out.push({title:String(lvl[i].title||'').trim().slice(0,60)||'(제목 없음)',start:pg});
  }
  return out;
}
async function pdfSections(pdf,texts){
  var n=texts.length,list=await outlineSecs(pdf),how='목차';
  if(list.length<3){
    list=[];how='제목 추정';
    var re=/^\s*(제\s*\d+\s*[장편부]|chapter\s+\d+|part\s+[ivx\d]+|\d{1,2}\s*장\b|\d{1,2}\.\s+[A-Z가-힣])/i;
    texts.forEach(function(t,i){var h=t.trim().slice(0,120);if(re.test(h))list.push({title:h.slice(0,40),start:i+1})});
  }
  if(list.length<3){
    list=[];how='구간 분할';
    for(var p=1;p<=n;p+=20)list.push({title:(p)+'~'+Math.min(n,p+19)+'쪽: '+texts[p-1].trim().slice(0,30),start:p});
  }
  list.sort(function(a,b){return a.start-b.start});
  var uniq=[];list.forEach(function(x){if(!uniq.length||uniq[uniq.length-1].start!==x.start)uniq.push(x)});
  if(uniq[0].start>1)uniq.unshift({title:'(앞부분)',start:1});
  uniq.forEach(function(x,i){x.end=i+1<uniq.length?uniq[i+1].start-1:n;if(x.end<x.start)x.end=x.start;x.how=how});
  return uniq;
}

}

function cleanPlan(data,cands,type){
  var ids={};cands.forEach(function(c){ids[c.id]=1});
  var reqs=(data.reqs||[]).map(String).filter(Boolean).slice(0,4);
  if(!reqs.length) throw {code:'invalid_json',message:'no reqs'};
  var ms=[];
  (data.missions||[]).slice(0,S.fast?2:CONFIG.maxMissions).forEach(function(m){
    var picks=[],total=0,cap=type==='ex'?CONFIG.exSent:CONFIG.cxSent,per=type==='ex'?CONFIG.exSent:5;
    (m.picks||[]).slice(0,3).forEach(function(p){
      var c=S.by[p.chunk_id];if(!c||!ids[c.id])return;
      var a=Math.round(+p.from),b=Math.round(+p.to);
      if(!(a>=1&&b>=a&&b<=c.s.length))return;
      if(b-a+1>per)b=a+per-1;
      if(total+(b-a+1)>cap)return;
      total+=b-a+1;picks.push([c.id,a,b]);
    });
    var QO=['literal','inferential','evaluative'];
    var raw=Array.isArray(m.variants)&&m.variants.length?m.variants:(m.question?[m]:[]);
    var seen={},vars=[];
    raw.forEach(function(v){
      var qt=QO.indexOf(v&&v.qtype)>=0?v.qtype:'literal';
      if(!v||!v.question||seen[qt])return;seen[qt]=1;
      vars.push({qtype:qt,q:String(v.question),keys:(Array.isArray(v.key_points)?v.key_points:[]).map(String).filter(Boolean).slice(0,3),cue:String(v.cue||'').slice(0,160),frame:String(v.frame||'').slice(0,160)});
    });
    vars.sort(function(x,y){return QO.indexOf(x.qtype)-QO.indexOf(y.qtype)});
    if(!picks.length||!vars.length)return;
    var base=vars.filter(function(v){return v.qtype==='inferential'})[0]||vars[0];
    var qt=base.qtype,keys=base.keys,cue=base.cue,frame=base.frame;
    var chars=picks.reduce(function(n,p){return n+resolve(p).text.length},0);
    ms.push({req:Math.min(reqs.length,Math.max(1,Math.round(+m.req)||1)),mins:Math.max(1,Math.ceil(chars/CONFIG.cpm))+CONFIG.answerMin,pick:picks,q:base.q,qtype:qt,keys:keys,cue:cue,frame:frame,vars:vars,live:true});
  });
  if(!ms.length) throw {code:'invalid_json',message:'no valid mission'};
  var used={};ms.forEach(function(m){m.pick.forEach(function(p){used[p[0]]=1})});
  var flow=(data.flow||[]).filter(function(id){return ids[id]&&!used[id]});
  var noInfer=!ms.some(function(m){return m.vars.some(function(v){return v.qtype!=='literal'})});
  return {reqs:reqs,ms:ms,flow:flow,reason:String(data.reason||''),dropped:(data.missions||[]).length-ms.length,noInfer:noInfer};
}
async function planLive(cands,type,reqs){
  var forced=type?'읽기 유형은 반드시 "'+(type==='ex'?'excerpt':'context')+'"로 하세요.':'과제를 보고 읽기 유형을 판단하세요.';
  var reqLine=reqs?'과제 요구 항목은 다음을 그대로 사용하세요: '+JSON.stringify(reqs)+'\n':'';
  var prompt=RULES+'다음 과제와 읽기 자료를 보고 읽기 지도를 JSON으로 만드세요.\n\n[과제 안내문]\n'+S.assign+'\n\n[읽기 자료] 한 줄이 한 청크이며 [청크ID] (문장번호) 문장 형식입니다.\n'+chunkText(cands)+'\n\n'+reqLine+forced+'\n'+
   '규칙:\n- reqs: 과제 안내문을 2~4개의 요구 항목으로 나눕니다(자료 요약이 아니라 과제 요구의 정리).\n'+
   '- type: "excerpt"(특정 정보·정의·결과·인용을 찾아 쓰는 과제) 또는 "context"(저자의 논리 흐름이나 관점을 이해해야 하는 과제: 비판, 평가, 비교, 논증, 서평, 선행연구 간 관계 정리).\n'+
   '- missions: 기본 '+(S.fast?2:CONFIG.missions)+'개(최소 2개, 최대 '+(S.fast?2:CONFIG.maxMissions)+'개). 각 미션은 요구 항목 하나(req 번호)와 연결합니다. 초록·요약·결론처럼 이미 요약된 청크는 미션 대상으로 고르지 말고 주장·근거·데이터가 실제로 있는 본문 청크를 고릅니다.\n'+
   '- picks: 위 자료에 있는 chunk_id와 문장 번호(from~to)만 사용합니다. excerpt이면 한 미션당 총 1~'+CONFIG.exSent+'문장, context이면 핵심 문장과 그 앞뒤 문단(총 3~'+CONFIG.cxSent+'문장, 청크는 최대 3개).\n'+
   '- variants: 미션마다 같은 발췌에 대해 깊이가 다른 질문 변형을 만듭니다. "literal"(이해: 발췌에 적힌 내용을 자기 말로), "inferential"(추론: 적혀 있지 않지만 끌어낼 수 있는 원인·함의·조건 적용·문장 사이의 관계), "evaluative"(평가: 근거의 충분성, 논리의 약한 지점). '+(S.fast?'literal과 inferential 두 가지만 만듭니다(evaluative는 만들지 않습니다).':'가능하면 세 가지 모두, 어려우면 literal과 inferential 두 가지는 반드시 만듭니다.')+' 학생의 수행에 따라 앱이 하나를 골라 보여 줍니다.\n'+
   '- 각 변형의 question: 하나만, 60자 이내. 원문 문장을 그대로 옮기지 말고 qtype에 맞게 씁니다.\n'+
   '- 각 변형의 cue: 읽기 전에 학생이 주목할 점 한 문장, 40자 이내(어디를, 어떤 관계를 볼지). 답 자체를 말하지 않습니다.\n'+
   '- 각 변형의 frame: 답변을 시작할 틀 한 문장, 50자 이내, 빈칸(____)을 포함합니다. 핵심 요소의 내용은 빈칸 밖에 쓰지 않습니다.\n'+
   '- 각 변형의 key_points: 학생의 답이 맞는지 판정할 핵심 요소 2개를 각 30자 이내로. 학생에게 공개하지 않는 판정 기준입니다.\n'+
   '- 군더더기 설명 없이 JSON만, 가능한 한 짧게 씁니다.\n'+
   '- flow: 전체 흐름 파악용으로만 보면 되는 청크 ID(초록·요약·결론 등, 없으면 빈 배열).\n- reason: 읽기 유형을 그렇게 판단한 이유 한 문장.\n\n'+
   'JSON만 출력하세요. 형식 예: {"reqs":["..."],"type":"excerpt","reason":"...","missions":[{"req":1,"picks":[{"chunk_id":"p3-2","from":1,"to":2}],"variants":[{"qtype":"literal","question":"...","cue":"...","frame":"... ____ ...","key_points":["..."]},{"qtype":"inferential","question":"...","cue":"...","frame":"...","key_points":["...","..."]},{"qtype":"evaluative","question":"...","cue":"...","frame":"...","key_points":["..."]}]}],"flow":["p1-1"]}';
  var data=await ask(prompt,'default');
  var t=type||(data.type==='context'?'cx':'ex');
  var p=cleanPlan(data,cands,t);p.type=t;return p;
}

async function startLive(){
  var asg=$('#asg2').value.trim(),f=$('#pdf').files[0],paste=$('#paste').value.trim(),st=$('#stat');
  if(!asg){$('#asg2').focus();st.textContent='과제 안내문을 입력해 주세요.';return}
  if(!f&&!paste){st.textContent='읽기 자료를 올리거나 붙여넣어 주세요.';return}
  var consent=$('#consent').checked,who=$('#who').value,pid=$('#pid').value.trim(),devon=$('#devon').checked;
  S.fast=!!($('#fast')&&$('#fast').checked);
  busy(true);st.textContent='자료를 읽는 중…';
  var chunks,name;
  try{
    if(f){
      name=f.name;
      if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){var info=await pdfRead(f,st);chunks=await choosePdfChunks(info,asg,st)}else chunks=textChunks(await f.text());
    }else{name='붙여넣은 본문';chunks=textChunks(paste)}
  }catch(e){
    busy(false);st.textContent=(e&&e.code==='toolong')?'PDF가 '+CONFIG.hardPages+'쪽을 넘습니다. 필요한 부분만 잘라서 올려 주세요.':(e&&e.code==='nopdf')?'PDF 읽기 도구를 불러오지 못했습니다. 본문을 붙여넣어 주세요.':'파일을 읽지 못했습니다. 암호가 걸렸거나 손상된 PDF일 수 있어요. 본문을 붙여넣어 주세요.';
    return;
  }
  var chars=chunks.reduce(function(n,c){return n+c.t.length},0);
  if(chars<200){busy(false);st.textContent='추출된 글자가 거의 없습니다. 스캔본이면 본문을 붙여넣어 주세요.';return}
  S.mode='live';S.chunks=chunks;S.by=mapBy(chunks);S.assign=asg;S.consent=consent;S.src=name;S.researcher=who;S.paperId=pid;S.devOn=devon&&!!CAP.db;S.plans={};S.reasons={};S.flowBy={};
  renderDoc();badges(false);$('#docnote').textContent=name+' · '+(S.rangeInfo&&!S.rangeInfo.all?S.rangeInfo.label+' · ':'')+chunks.length+'개 문단';
  add('me','과제 안내문과 읽기 자료('+name+')를 올렸습니다.');
  log('upload',{source:'user',chunks:chunks.length,chars:chars});
  var tk0=Date.now(),tk=null,base0='Claude가 과제 안내문과 자료를 읽고 읽기 지도를 만드는 중입니다. 자료 길이에 따라 10초에서 1분쯤 걸려요.';
  var th=add('ai','<p>Claude가 과제 안내문과 자료를 읽고 읽기 지도를 만드는 중입니다. 몇 초에서 1분쯤 걸려요.</p>');
  tk=setInterval(function(){var p=th.querySelector('p');if(p)p.textContent=(S.stage||base0)+' (경과 '+Math.round((Date.now()-tk0)/1000)+'초)'},1000);
  try{
    S.stage=chars>30000?'1/2 자료에서 과제와 관련된 부분을 고르는 중입니다.':'';
    var cands=chars>30000?await prefilter(chunks,asg):chunks;
    S.stage='2/2 읽기 지도를 만드는 중입니다. (미션, 질문, 판정 기준을 함께 만드느라 가장 오래 걸립니다)';
    S.cands=cands;
    var p=await planLive(cands,null,null);
    S.type=p.type;S.plans[p.type]=p.ms;S.reqs=p.reqs;S.flowBy[p.type]=p.flow;S.reasons[p.type]=p.reason;
    S.stage='';clearInterval(tk);th.remove();S.busy=false;
    log('analysis_done',{reqs:p.reqs.length,reading_type:p.type,missions:p.ms.length,dropped_invalid:p.dropped});
    if(p.noInfer)log('no_inferential_question',null,true);
    devInit({readingType:p.type,reqs:p.reqs,reason:p.reason,flow:p.flow,droppedInvalid:p.dropped,noInferential:p.noInfer,pagesTotal:S.pages||null,range:S.rangeInfo||null,
      missions:p.ms.map(function(m){return {req:m.req,mins:m.mins,qtype:m.qtype,question:m.q,keys:m.keys,cue:m.cue,frame:m.frame,variants:m.vars,picks:m.pick,excerpt:excerptText(m)}})});
    afterPlan();
  }catch(e){
    S.stage='';clearInterval(tk);th.remove();busy(false);
    log('analysis_failed',{code:e&&e.code||'error'},true);
    add('ai','<p class="warn">'+esc(errCopy(e))+'</p>');
    st.textContent='다시 시도하려면 “내 자료로 분석 시작”을 눌러 주세요.';
  }
}

/* ---------- 2~3단계: 미션과 피드백 ---------- */
function pickVariant(m,i){
  var QO=['literal','inferential','evaluative'];
  if(!m.vars||!m.vars.length){S.curDepth=QO.indexOf(m.qtype||'literal');return}
  var d=CONFIG.adaptDepth?S.depth:1;
  if(CONFIG.adaptDepth&&N()>1&&i===N()-1)d=Math.max(d,CONFIG.lastMinDepth);
  var best=null,bd=9;
  m.vars.forEach(function(v){var k=Math.abs(QO.indexOf(v.qtype)-d);if(k<bd||(k===bd&&QO.indexOf(v.qtype)>QO.indexOf(best.qtype))){best=v;bd=k}});
  m.q=best.q;m.qtype=best.qtype;m.keys=best.keys;m.cue=best.cue;m.frame=best.frame;
  S.curDepth=QO.indexOf(best.qtype);
}
function showMission(i){
  S.m=i;S.att=0;S.level=0;S.viewed=false;S.failed=false;S.cueAsked=false;S.curSup=CONFIG.fade?S.sup:CONFIG.supStart;
  var m=plan()[i];pickVariant(m,i);
  var parts=m.pick.map(resolve);
  clearHl();setStep(2);note(TN[S.type]+' · 미션 '+(i+1)+'/'+N());
  var h='<div><span class="tag m">미션 '+(i+1)+'/'+N()+'</span> <span class="tag">'+QL[m.qtype||'literal']+' 질문</span> 과제 연결: 요구 항목 '+m.req+' ('+esc(S.reqs[m.req-1]||'')+')</div>'+
   '<blockquote class="ex">'+parts.map(function(p){return '<p>'+esc(p.text)+'</p>'}).join('')+'</blockquote>'+
   '<div class="src-line">출처: '+parts.map(function(p){return esc(p.sec)+' · '+p.id+' · '+p.range}).join(' / ')+'</div>'+
   '<div class="verify">✓ 서버 검증: 청크 ID와 문장 번호로 원문에서 직접 인용 ('+(parts.every(function(p){return p.ok})?'원문 일치':'불일치')+')</div>'+
   '<p class="q">질문: '+esc(m.q)+'</p>'+scaffoldHtml(m,S.curSup);
  add('ai',h,prog(i+1));
  log('mission_shown',{m:i+1,support:S.curSup,depth:S.curDepth,qtype:m.qtype,model_output:{chunk_ids:m.pick.map(function(p){return p[0]}),sentences:m.pick.map(function(p){return p[1]+'-'+p[2]})}});
  answerBox();
}
/* ---------- 안내 수준(스캐폴딩 페이딩) ---------- */
var SUPN=['안내 없음','읽기 전 안내','읽기 전 안내 + 답변 틀'];
function scaffoldHtml(m,sup){
  var h='<div class="src-line">안내 수준: '+SUPN[sup]+'</div>';
  if(sup>=1&&m.cue)h+='<p><b>읽기 전에 볼 점</b> '+esc(m.cue)+'</p>';
  if(sup>=2&&m.frame)h+='<p><b>답변 틀</b> '+esc(m.frame)+'</p>';
  return h;
}
function fadeAfter(i){
  var prev=S.curSup,next=prev,used=S.level,why='';
  if(CONFIG.fade){
    if(used===0&&!S.cueAsked){
      if(prev>0){next=prev-1;why='힌트 없이 답하셨어요. 다음 미션은 안내를 한 단계 줄입니다.'}
    }else if(used>=2){
      if(prev<CONFIG.supStart){next=prev+1;why='이번에는 힌트가 많이 필요했어요. 다음 미션은 안내를 한 단계 늘립니다.'}
    }
  }
  var pd=S.curDepth,nd=pd;
  if(CONFIG.adaptDepth){
    if(used===0&&!S.cueAsked){nd=Math.min(2,pd+1);if(nd>pd)why+=(why?' ':'')+'다음 질문은 한 단계 더 깊어집니다.'}
    else if(used>=2){nd=Math.max(0,pd-1);if(nd<pd)why+=(why?' ':'')+'다음 질문은 한 단계 쉬운 유형으로 바꿉니다.'}
  }
  S.depth=nd;
  S.supPath.push({m:i+1,sup:prev,depth:pd,qtype:plan()[i].qtype,hints:used,cueAsked:S.cueAsked});
  S.sup=next;
  log('support_changed',{m:i+1,from:prev,to:next,hints:used,depthFrom:pd,depthTo:nd});
  if(why&&i+1<N()&&!S.only)add('ai','<p class="note">'+why+'</p>',prog(i+1));
}

  };

}
function passMission(i,m,text,praise){
  S.answers.push({m:i,text:text,req:m.req});
  if(S.level>0)S.hint++;else S.noHint++;
  if(S.failed&&S.viewed){S.selfFix.push('미션 '+(i+1));log('self_correction',{m:i+1})}
  log('mission_passed',{m:i+1,hints:S.level,attempts:S.att});
  fadeAfter(i);
  add('ai',(praise?'<p>'+esc(praise)+'</p>':'')+'<p>정리: “'+esc(text)+'” → 요구 항목 '+m.req+'에 쓸 수 있어요.</p>',prog(i+1));

}

  add('ai','<p>'+(partial?'방향은 맞아요. 아직 빠진 부분이 있습니다.':'발췌문을 한 번 더 천천히 읽어 보세요.')+'</p><p><span class="hintpill">힌트 '+S.level+'/3</span>'+esc(hint)+'</p>',prog(i+1));
}
function unresolvedMission(i,m){

  add('ai','<p>힌트를 모두 썼지만 아직 핵심에 닿지 못했어요. 이 미션은 미완료로 표시하고 넘어갑니다. 나중에 해당 위치를 다시 읽어 보세요. 정답 문장은 따로 드리지 않습니다.</p>',prog(i+1));

     '판정: 핵심 요소를 모두 자기 말로 담았으면 "pass", 일부만 담았으면 "partial", 틀리거나 빠졌으면 "fail". 핵심 요소 문장을 힌트에 그대로 쓰지 않습니다.\n'+

     'JSON만 출력: {"verdict":"pass|partial|fail","praise":"학생이 잘 이해한 부분을 구체적으로 한 문장(없으면 빈 문자열)","hint":"pass가 아닐 때만 한두 문장"}','quick');

}

/* ---------- 4단계: 과제 수행 지원 ---------- */

/* ---------- 인출 확인 ---------- */

function recallPick(){
  var best=-1;
  S.answers.forEach(function(a){var q=plan()[a.m].qtype;if(best<0&&(q==='inferential'||q==='evaluative'))best=a.m});
  if(best<0)best=S.answers[S.answers.length-1].m;
  return best;
}
function keyLines(m){return (m.keys&&m.keys.length)?m.keys.map(function(k){return '- '+k}).join('\n'):'(없음: 질문이 요구한 핵심으로 판단)'}

$('#doc').addEventListener('click',function(e){

    ?'<p>'+esc(out.join(', '))+'은(는) 이번 미션에서 읽지 않은 부분이에요. 근거로 쓰실 거라면 원문을 직접 읽고 문장을 대조해 보세요.</p>'
    :'<p>미션에서 직접 읽은 부분을 근거로 고르셨어요.</p>';

function ownerPanel(){
  var own=false;
  try{own=!!(CAP.user&&CAP.user.isOwner&&CAP.user.isOwner())}catch(e){}
  if(!own||!CAP.db)return;
  $('#own').hidden=false;
  $('#ownload').onclick=function(){
    $('#ownbody').textContent='불러오는 중…';
    CAP.db.collection('sessions').orderBy('ts','desc').limit(200).get().then(function(snap){
      var rows=snap.docs.map(function(d){return d.data()});
      if(!rows.length){$('#ownbody').textContent='아직 동의하고 저장된 세션이 없습니다.';return}
      var avg=function(f){var a=rows.map(f).filter(function(x){return typeof x==='number'&&isFinite(x)});return a.length?(a.reduce(function(p,c){return p+c},0)/a.length):null};
      var f1=function(x){return x==null?'-':x.toFixed(1)};
      var noHintRate=avg(function(r){return (r.noHint+r.hint)?r.noHint/(r.noHint+r.hint)*100:NaN});
      var doneRate=avg(function(r){return r.total?r.done/r.total*100:NaN});
      $('#ownbody').innerHTML='<dl class="sum"><dt>세션 수</dt><dd>'+rows.length+'</dd><dt>힌트 없이 답한 비율</dt><dd>'+f1(noHintRate)+'%</dd><dt>미션 완료율</dt><dd>'+f1(doneRate)+'%</dd><dt>평균 읽기 부담</dt><dd>'+f1(avg(function(r){return r.load}))+' / 5</dd><dt>평균 힌트 수</dt><dd>'+f1(avg(function(r){return r.hintGiven}))+'</dd></dl>'+
        (CAP.dl?'<div class="row"><button class="ghost" id="owncsv" type="button">CSV로 저장</button></div>':'');
      if($('#owncsv'))$('#owncsv').onclick=function(){
        var head=['ts','source','type','done','total','noHint','hint','hintGiven','selfFix','load'];
        saveFile('readmate-sessions.csv',[head.join(',')].concat(rows.map(function(r){return head.map(function(k){return r[k]}).join(',')})).join('\n'));
      };
    }).catch(function(){$('#ownbody').textContent='불러오지 못했습니다.'});
  };
}

/* ---------- 로그 패널 도구 ---------- */
$('#halluc').onclick=function(){
  $('#logbox').open=true;
  if(!S.chunks.length){$('#testout').textContent='자료를 먼저 올려 주세요. 올린 자료의 첫 문단으로 검증합니다.';return}
  var c0=S.chunks[0],real=c0.s[0];
  var good=validateQuote(c0.id,real);
  var fake=validateQuote(c0.id,'이 문서는 반드시 24시간 안에 제출해야 한다고 적혀 있다.');
  var ghost=validateQuote('p999-9','존재하지 않는 문단의 문장이다.');
  $('#testout').textContent='실제 문장 → '+(good.ok?'통과':'거부')+'\n지어낸 문장 → '+(fake.ok?'통과':'거부 ('+fake.reason+')')+'\n없는 청크 → '+(ghost.ok?'통과':'거부 ('+ghost.reason+')');
  if(!fake.ok)log('excerpt_rejected',{chunk_id:c0.id,reason:fake.reason,action:'regenerate'},true);
  if(!ghost.ok)log('excerpt_rejected',{chunk_id:'p999-9',reason:ghost.reason,action:'regenerate'},true);
};
$('#reset').onclick=init;
initCaps();
init();
})();
