# main에 push할 때마다 web/ 폴더를 GitHub Pages로 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions"로 바꾼다.
# 주소: https://<계정>.github.io/<저장소>/  (예: https://nahye26.github.io/ReadMate/)
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
